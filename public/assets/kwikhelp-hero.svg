<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="panel" x1="80" y1="40" x2="560" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F1FE"/>
      <stop offset="1" stop-color="#D2E3FC"/>
    </linearGradient>
    <linearGradient id="bubble" x1="220" y1="90" x2="420" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4285F4"/>
      <stop offset="1" stop-color="#3367D6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4285F4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ambient blobs -->
  <circle cx="520" cy="90" r="70" fill="#4285F4" opacity="0.08"/>
  <circle cx="120" cy="420" r="90" fill="#4285F4" opacity="0.07"/>
  <circle cx="560" cy="380" r="50" fill="#93C5FD" opacity="0.35"/>

  <!-- soft platform -->
  <ellipse cx="320" cy="450" rx="210" ry="28" fill="#4285F4" opacity="0.08"/>

  <!-- main chat card -->
  <g filter="url(#soft)">
    <rect x="150" y="70" width="340" height="290" rx="28" fill="url(#panel)" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="150" y="70" width="340" height="54" rx="28" fill="#F8FBFF"/>
    <rect x="150" y="98" width="340" height="26" fill="#F8FBFF"/>
    <circle cx="182" cy="97" r="7" fill="#F87171"/>
    <circle cx="204" cy="97" r="7" fill="#FBBF24"/>
    <circle cx="226" cy="97" r="7" fill="#34D399"/>
    <rect x="260" y="90" width="120" height="14" rx="7" fill="#BFDBFE"/>
  </g>

  <!-- conversation -->
  <rect x="178" y="150" width="170" height="52" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <circle cx="198" cy="176" r="12" fill="#93C5FD"/>
  <path d="M192 176h12M198 170v12" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round"/>
  <rect x="218" y="166" width="98" height="8" rx="4" fill="#CBD5E1"/>
  <rect x="218" y="180" width="68" height="8" rx="4" fill="#E2E8F0"/>

  <rect x="292" y="220" width="170" height="52" rx="18" fill="url(#bubble)"/>
  <rect x="316" y="236" width="110" height="8" rx="4" fill="#FFFFFF" opacity="0.95"/>
  <rect x="316" y="250" width="72" height="8" rx="4" fill="#FFFFFF" opacity="0.7"/>

  <rect x="178" y="290" width="150" height="42" rx="16" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
  <rect x="198" y="306" width="104" height="8" rx="4" fill="#CBD5E1"/>

  <!-- floating video call pill -->
  <g filter="url(#soft)">
    <rect x="430" y="150" width="150" height="72" rx="20" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="462" cy="186" r="18" fill="#DBEAFE"/>
    <circle cx="462" cy="182" r="7" fill="#4285F4"/>
    <path d="M451 196c2.5-6 7-9 11-9s8.5 3 11 9" fill="#93C5FD"/>
    <rect x="490" y="174" width="66" height="8" rx="4" fill="#94A3B8"/>
    <rect x="490" y="190" width="44" height="8" rx="4" fill="#CBD5E1"/>
    <circle cx="560" cy="160" r="7" fill="#22C55E"/>
  </g>

  <!-- verified badge -->
  <g filter="url(#soft)">
    <rect x="70" y="210" width="150" height="64" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="104" cy="242" r="16" fill="#DCFCE7"/>
    <path d="M96 242l5 5 10-11" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="130" y="228" width="68" height="8" rx="4" fill="#94A3B8"/>
    <rect x="130" y="244" width="48" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- brand speech bubble -->
  <g filter="url(#soft)" transform="translate(250 355)">
    <path d="M20 8h100a20 20 0 0 1 20 20v40a20 20 0 0 1-20 20H72l-18 22-2-22H20A20 20 0 0 1 0 68V28A20 20 0 0 1 20 8Z" fill="url(#bubble)"/>
    <text x="70" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">K</text>
  </g>

  <!-- calendar chip -->
  <g filter="url(#soft)">
    <rect x="460" y="300" width="110" height="90" rx="18" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <rect x="460" y="300" width="110" height="28" rx="18" fill="#4285F4"/>
    <rect x="460" y="316" width="110" height="12" fill="#4285F4"/>
    <rect x="478" y="342" width="18" height="16" rx="4" fill="#DBEAFE"/>
    <rect x="506" y="342" width="18" height="16" rx="4" fill="#93C5FD"/>
    <rect x="534" y="342" width="18" height="16" rx="4" fill="#DBEAFE"/>
    <rect x="478" y="366" width="18" height="16" rx="4" fill="#BFDBFE"/>
    <rect x="506" y="366" width="18" height="16" rx="4" fill="#4285F4"/>
  </g>
</svg>
