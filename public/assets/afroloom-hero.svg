<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="board" x1="80" y1="40" x2="520" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#FFE8B8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4285F4"/>
      <stop offset="1" stop-color="#3367D6"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#D97706" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="540" cy="100" r="78" fill="#F59E0B" opacity="0.1"/>
  <circle cx="90" cy="430" r="90" fill="#4285F4" opacity="0.08"/>
  <circle cx="560" cy="400" r="46" fill="#FCD34D" opacity="0.35"/>
  <ellipse cx="320" cy="495" rx="220" ry="26" fill="#D97706" opacity="0.08"/>

  <!-- main hub card -->
  <g filter="url(#soft)">
    <rect x="150" y="70" width="340" height="300" rx="28" fill="url(#board)" stroke="#FDE68A" stroke-width="2"/>
    <rect x="178" y="98" width="140" height="14" rx="7" fill="#FCD34D"/>
    <rect x="178" y="124" width="220" height="12" rx="6" fill="#F3E8C8"/>
    <rect x="178" y="146" width="180" height="12" rx="6" fill="#F8EFDA"/>
  </g>

  <!-- Loomstore product tile -->
  <g filter="url(#soft)">
    <rect x="178" y="188" width="136" height="148" rx="20" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <rect x="196" y="208" width="100" height="68" rx="14" fill="url(#amber)"/>
    <path d="M226 248h40M236 234h20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="196" y="290" width="72" height="10" rx="5" fill="#FBBF24"/>
    <rect x="196" y="308" width="52" height="8" rx="4" fill="#F3E8C8"/>
  </g>

  <!-- Kwikhelp product tile -->
  <g filter="url(#soft)">
    <rect x="326" y="188" width="136" height="148" rx="20" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="344" y="208" width="100" height="68" rx="14" fill="url(#blue)"/>
    <path d="M364 224h60a14 14 0 0 1 14 14v18a14 14 0 0 1-14 14h-22l-12 14-2-14h-24a14 14 0 0 1-14-14v-18a14 14 0 0 1 14-14Z" fill="#FFFFFF" opacity="0.95"/>
    <text x="394" y="255" text-anchor="middle" fill="#3367D6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">K</text>
    <rect x="344" y="290" width="72" height="10" rx="5" fill="#93C5FD"/>
    <rect x="344" y="308" width="52" height="8" rx="4" fill="#DBEAFE"/>
  </g>

  <!-- floating coming soon chip -->
  <g filter="url(#soft)">
    <rect x="430" y="120" width="150" height="64" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <circle cx="462" cy="152" r="14" fill="#F3F4F6"/>
    <path d="M456 152h12M462 146v12" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="486" y="142" width="72" height="8" rx="4" fill="#9CA3AF"/>
    <rect x="486" y="158" width="48" height="8" rx="4" fill="#D1D5DB"/>
  </g>

  <!-- trust chip -->
  <g filter="url(#soft)">
    <rect x="60" y="240" width="150" height="64" rx="18" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="94" cy="272" r="16" fill="#FEF3C7"/>
    <path d="M87 272l5 5 10-11" stroke="#D97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="120" y="258" width="66" height="8" rx="4" fill="#D97706"/>
    <rect x="120" y="274" width="48" height="8" rx="4" fill="#FCD34D"/>
  </g>

  <!-- brand mark -->
  <g filter="url(#soft)">
    <circle cx="320" cy="420" r="42" fill="url(#amber)"/>
    <text x="320" y="432" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">A</text>
  </g>
</svg>
